<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard — My Private Stock Lab</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="styles/brand.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">My Private Stock Lab</div>
    <div class="auth">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </header>

  <main class="container">
    <section id="gate" class="card">
      <h2>Sign in required</h2>
      <p>Please sign in to view your dashboard.</p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="grid">
        <div class="card">
          <h3>Watchlist</h3>
          <form id="addTickerForm">
            <input id="tickerInput" placeholder="Add ticker (e.g., AAPL)" />
            <button type="submit">Add</button>
          </form>
          <ul id="watchlist"></ul>
        </div>

        <div class="card">
          <h3>Principle Checks</h3>
          <p>For selected ticker: <strong id="activeTicker">—</strong></p>
          <div id="principles"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="assets/firebase-auth.js"></script>
  <script type="module" src="assets/market.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
